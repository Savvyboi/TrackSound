[project]
name = "tracksound"
version = "0.2.0"
description = "Local web app for acoustic geolocation of audio and video recordings"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["geolocation", "acoustics", "osint", "doppler", "ads-b", "lightning", "enf", "spectrogram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "dopplertrack==0.2.0",
    "fastapi>=0.162.0",
    "h5py>=3.16.0",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Savvyboi/TrackSound"
Issues = "https://github.com/Savvyboi/TrackSound/issues"

[project.scripts]
tracksound = "tracksound.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or minutes of CPU"]
addopts = "-m 'not slow'"

[dependency-groups]
bundle = [
    "pyinstaller>=6.10",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
