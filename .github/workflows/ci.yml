name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run pytest -q

  package:
    # A clean install of the wheel must start and work: catches runtime dependencies that
    # are only present in the dev environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel
        working-directory: backend
      - name: Install into a clean environment and smoke-test it
        run: |
          uv tool install --python 3.12 backend/dist/*.whl
          uv run --no-project --python 3.12 python .github/scripts/smoke_test.py "$(uv tool dir --bin)/tracksound"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: The committed web UI matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../backend/src/tracksound/web)" ]; then
            git status --short -- ../backend/src/tracksound/web
            echo "::error::backend/src/tracksound/web is out of date: run 'npm run build' in frontend/ and commit it"
            exit 1
          fi
